[project]
name = "ret-c2-338"
version = "1.0.0"
description = "Retail Personalised Offer & Promo Copy Generator — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the distributing package registry at build and test time.
# Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff.lint.per-file-ignores]
# 既知の lint 違反は、該当する boundary-test ファイルだけで抑止する。
"tests/proof_of_boundary/test_import_isolation.py" = ["F541"]
"tests/proof_of_boundary/test_state_safety.py" = ["F541"]
